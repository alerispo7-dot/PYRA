name: Build PYRA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --target PYRA_All --parallel 4 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Build failed on ${{ matrix.name }}"; echo '```'; grep -E "error|Error|fatal" build.log | grep -v "warning" | head -60; echo '```'; } > report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@report.md || true

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          ART=build/PYRA_artefacts/Release
          mkdir -p dist/PYRA
          cp -R "$ART/VST3/PYRA.vst3" dist/PYRA/
          mkdir -p dist/PYRA/PYRA.vst3/Contents/Resources
          cp -R Samples dist/PYRA/PYRA.vst3/Contents/Resources/Samples
          cp packaging/CREDITS.txt dist/PYRA/
          cp -R "$ART/AU/PYRA.component" dist/PYRA/
          cp -R "$ART/Standalone/PYRA.app" dist/PYRA/
          # Apple Silicon only loads signed code: give everything an ad-hoc signature
          for b in dist/PYRA/PYRA.vst3 dist/PYRA/PYRA.component dist/PYRA/PYRA.app; do
            codesign --force --deep --sign - "$b"
          done
          cp packaging/INSTALL_MAC.txt dist/PYRA/
          cp packaging/install_mac.command dist/PYRA/
          chmod +x dist/PYRA/install_mac.command
          cd dist && ditto -c -k --sequesterRsrc --keepParent PYRA PYRA-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $art = "build/PYRA_artefacts/Release"
          New-Item -ItemType Directory -Force -Path dist/PYRA | Out-Null
          Copy-Item -Recurse "$art/VST3/PYRA.vst3" dist/PYRA/
          New-Item -ItemType Directory -Force -Path dist/PYRA/PYRA.vst3/Contents/Resources | Out-Null
          Copy-Item -Recurse Samples dist/PYRA/PYRA.vst3/Contents/Resources/Samples
          Copy-Item packaging/CREDITS.txt dist/PYRA/
          Copy-Item "$art/Standalone/PYRA.exe" dist/PYRA/
          Copy-Item packaging/INSTALL_WINDOWS.txt dist/PYRA/
          Copy-Item packaging/install_windows.bat dist/PYRA/
          Compress-Archive -Path dist/PYRA -DestinationPath dist/PYRA-Windows.zip

      - name: Test the installer (install, update, update while a program keeps PYRA open)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $dll = "$env:CommonProgramFiles\VST3\PYRA.vst3\Contents\x86_64-win\PYRA.vst3"
          Push-Location dist/PYRA
          cmd /c "install_windows.bat < nul"
          if (-not (Test-Path $dll)) { throw "fresh install failed" }
          cmd /c "install_windows.bat < nul"
          if (-not (Test-Path $dll)) { throw "update failed" }
          # a program that keeps PYRA loaded, like an open FL Studio
          @"
          Add-Type -Name K -Namespace W -MemberDefinition '[DllImport("kernel32.dll", CharSet = CharSet.Unicode)] public static extern System.IntPtr LoadLibraryW(string p);'
          if ([W.K]::LoadLibraryW('$dll') -eq [System.IntPtr]::Zero) { exit 3 }
          Start-Sleep 180
          "@ | Set-Content "$env:RUNNER_TEMP\holder.ps1"
          $holder = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$env:RUNNER_TEMP\holder.ps1"
          Start-Sleep 8
          if ($holder.HasExited) { throw "could not load PYRA to hold it (exit $($holder.ExitCode))" }
          Remove-Item -LiteralPath $dll -ErrorAction SilentlyContinue
          if (-not (Test-Path $dll)) { throw "the test lock did not hold" }
          $env:PYRA_AUTOCLOSE = "1"
          cmd /c "install_windows.bat < nul"
          if (-not (Test-Path $dll)) { throw "update while PYRA was open failed" }
          if (-not $holder.HasExited) { throw "the installer did not close the program holding PYRA" }
          Get-ChildItem (Split-Path $dll) | Format-Table Name, Length, LastWriteTime
          Pop-Location

      - name: Validate with pluginval (like a DAW would)
        id: pluginval
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ART=build/PYRA_artefacts/Release
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip
            PV=pluginval.app/Contents/MacOS/pluginval
            TARGETS="$ART/VST3/PYRA.vst3"
          else
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pv.zip
            PV=./pluginval.exe
            TARGETS="$ART/VST3/PYRA.vst3"
          fi
          for t in $TARGETS; do
            echo "=== $t" | tee -a pluginval.log
            "$PV" --strictness-level 5 --timeout-ms 600000 --validate-in-process --validate "$t" 2>&1 | tee -a pluginval.log
          done

      - name: Report pluginval result
        if: steps.pluginval.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "pluginval found problems on ${{ matrix.name }}"; echo '```'; grep -iE "fail|error|crash|assert|!!!" pluginval.log | head -60; echo '```'; } > pv.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@pv.md || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PYRA-${{ matrix.name }}
          path: dist/PYRA-*.zip


  release:
    name: Publish downloads
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Get the version
        uses: actions/checkout@v4
        with:
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Get the builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MM=$(sed -n 's/^project(PYRA VERSION \([0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          VERSION="v${MM:-0.7}.${{ github.run_number }}"
          gh release create "$VERSION" dist/PYRA-*.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "PYRA $VERSION" \
            --notes "Scarica PYRA-macOS.zip (Mac, Apple Silicon e Intel) oppure PYRA-Windows.zip. Dentro trovi le istruzioni di installazione (INSTALL_MAC.txt / INSTALL_WINDOWS.txt)."
